<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>Notes App</title>
    <style>
        :root {
            --primary: #4CAF50;
            --danger: #dc3545;
            --background: #f0f2f5;
            --white: #ffffff;
            --gray: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--background);
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: var(--white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
        }

        .note-form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--gray);
            border-radius: 5px;
            font-size: 1rem;
        }

        .note-form button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .note-form button:hover {
            background: #388E3C;
        }

        .notes-list {
            list-style-type: none;
            margin-top: 20px;
        }

        .notes-list li {
            background: var(--gray);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: left;
        }

        .logout-button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background: var(--danger);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .logout-button:hover {
            background: #b02a37;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Notes App</h1>

        <section class="note-form">
            <h2>Add New Note</h2>
            <form id="note-form">
                {{ csrf_token() }}
                <textarea name="note" id="note-input" rows="4" placeholder="Enter your note here..." required></textarea>
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Live Notes Feed</h2>
            <ul class="notes-list" id="notes-list">
                {% for note in notes %}
                    <li>{{ note.content | e }}</li>
                {% endfor %}
            </ul>
        </section>

        <form action="/logout" method="post">
            {{ csrf_token() }}
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>

    <script>
        document.getElementById("note-form").addEventListener("submit", function(event) {
            event.preventDefault();
            let noteText = document.getElementById("note-input").value;

            fetch('/add_note', {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `note=${encodeURIComponent(noteText)}`
            }).then(response => response.json()).then(data => {
                if (data.success) {
                    let notesList = document.getElementById("notes-list");
                    let newNote = document.createElement("li");
                    newNote.textContent = noteText;
                    notesList.prepend(newNote);
                    document.getElementById("note-input").value = "";
                }
            });
        });
    </script>
</body>
</html>
